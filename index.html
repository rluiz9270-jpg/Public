<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluno e Média</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Cadastro de Nota do Aluno</h1>

    <label for="nome">Nome do aluno:</label>
    <input type="text" id="nome" placeholder="Digite o nome" />
    <br /><br />

    <label for="nota1">Nota 1:</label>
    <input type="number" id="nota1" step="0.01" min="0" max="10" />
    <br /><br />

    <label for="nota2">Nota 2:</label>
    <input type="number" id="nota2" step="0.01" min="0" max="10" />
    <br /><br />

    <label for="nota3">Nota 3:</label>
    <input type="number" id="nota3" step="0.01" min="0" max="10" />
    <br /><br />

    <label for="nota4">Nota 4:</label>
    <input type="number" id="nota4" step="0.01" min="0" max="10" />
    <br /><br />

    <button onclick="mostrarMedia()">Calcular Média</button>

    <div id="resultado" style="margin-top: 20px;"></div>

    <script>
        // variáveis globais
        let nomeAluno = "";
        let notasAluno = [];

        function lerDados() {
            nomeAluno = document.getElementById('nome').value;
            notasAluno = [
                parseFloat(document.getElementById('nota1').value) || 0,
                parseFloat(document.getElementById('nota2').value) || 0,
                parseFloat(document.getElementById('nota3').value) || 0,
                parseFloat(document.getElementById('nota4').value) || 0
            ];
        }

        function calcularMedia() {
            // variáveis locais
            let soma = 0;
            let quantidade = notasAluno.length;

            for (let i = 0; i < quantidade; i++) {
                soma += notasAluno[i];
            }

            let media = soma / quantidade;
            return media;
        }

        function mostrarMedia() {
            lerDados();
            const mediaAluno = calcularMedia();

            document.getElementById('resultado').innerHTML = `
                <p><strong>Nome:</strong> ${nomeAluno}</p>
                <p><strong>Média:</strong> ${mediaAluno.toFixed(2)}</p>
            `;
        }
    </script>
</body>
</html>
